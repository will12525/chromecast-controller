name: Python package

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Test with pytest
        env:
          # Ensure `app` package imports resolve from the repo root on the runner
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p tests/junit
          # Maintained green suites (legacy tests still use pre-refactor imports).
          python -m pytest \
            tests/test_library_home.py \
            tests/test_content_transfer_unit.py \
            tests/test_chromecast_uuid.py \
            -q --junitxml=tests/junit/test-results.xml
          test -f tests/junit/test-results.xml
          ls -la tests/junit

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: "**/tests/junit/test-results.xml"
          check_name: pytest results
