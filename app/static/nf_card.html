<article class="nf-tile">
    <div class="nf-tile-poster">
        <img class="nf-tile-img" alt="" loading="lazy" onerror="apply_default_image(this)">
        <div class="nf-tile-progress" hidden>
            <div class="nf-tile-progress-bar"></div>
        </div>
        <button type="button" class="nf-tile-play" aria-label="Play"><i class="bi-play-fill"></i></button>
        <span class="nf-tile-new" hidden>NEW</span>
    </div>
    <div class="nf-tile-meta">
        <div class="nf-tile-title"></div>
        <div class="nf-tile-sub"></div>
    </div>
</article>
