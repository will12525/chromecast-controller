# The mode is chosen when the session starts. A hardcoded mode is not used:
# panels disagree about which 1080p timing they will actually display, and a
# mode line for a disconnected port makes Sway cover the screen with an error.
default_border none
bindsym --repeat XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --repeat XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
exec /usr/local/bin/kiosk_output.sh
