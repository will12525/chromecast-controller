# cage selects the EDID preferred mode. This panel marks 720x480 preferred
# even though 1920x1080 is listed, so set the mode before Chromium starts.
output HDMI-A-1 mode 1920x1080
output HDMI-A-2 mode 1920x1080
default_border none
bindsym --repeat XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --repeat XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
exec /usr/local/bin/kiosk_audio.sh
exec /usr/bin/chromium --kiosk --ozone-platform=wayland --enable-features=UseOzonePlatform --disable-features=WaylandFractionalScaleV1 --start-maximized --force-device-scale-factor=1 --noerrdialogs --disable-infobars --check-for-update-interval=31536000 --app=http://127.0.0.1:5000
